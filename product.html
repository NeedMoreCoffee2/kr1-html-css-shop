<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Учебный интернет-магазин">
  <meta property="og:description" content="Учебный frontend-проект интернет-магазина.">
  <meta property="og:image" content="https://needmorecoffee2.github.io/kr1-html-css-shop/images/preview.JPG">
  <title>Товар</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/product.js" defer></script>
  <script src="js/order.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__logo" href="index.html">ShopProject</a>

      <nav class="site-nav" aria-label="Основная навигация">
        <ul class="site-nav__list">
          <li class="site-nav__item">
            <a class="site-nav__link site-nav__link--active" href="index.html">
              Главная
            </a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="catalog.html">Каталог</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="contacts.html">Контакты</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="index.html#advantages">Преимущества</a>
          </li>
          <li class="site-nav__item">
            <a class="site-nav__link" href="index.html#popular">
              Популярные товары
            </a>
          </li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <nav class="breadcrumbs" aria-label="Хлебные крошки">
      <a class="breadcrumbs__link" href="index.html">Главная</a>
      <a class="breadcrumbs__link-not-first" href="catalog.html">Каталог</a>
      <span class="breadcrumbs__current">Товар</span>
    </nav>

    <section id="card-all-list"></section>

  <dialog class="order-dialog" id="order-dialog" aria-labelledby="order-dialog-title">
    <h2 class="order-dialog__title" id="order-dialog-title">Оформление заявки</h2>

    <form class="order-form" id="order-form" action="#" method="post" novalidate>
      <input id="selected-product" name="selected-product" type="hidden">

      <div class="order-form__field">
        <label order-form__label for="order-name">Имя</label>
        <input
          class="order-form__input"
          id="order-name"
          name="name"
          type="text"
          placeholder="Введите ваше имя"
          minlength="2"
          autocomplete="given-name"
          required
        >
      </div>

      <div class="order-form__field">
        <label class="order-form__label" for="order-email">E-mail</label>
        <input
          class="order-form__input"
          id="order-email"
          name="email"
          type="email"
          placeholder="example@mail.ru"
          autocomplete="email"
          required
        >
      </div>

      <div class="order-form__field">
        <label class="order-form__label" for="order-phone">Телефон</label>
        <input
          class="order-form__input"
          id="order-phone"
          name="phone"
          type="tel"
          inputmode="tel"
          placeholder="+7 (900) 000-00-00"
          pattern="^\+7 \(\d{3}\) \d{3}-\d{2}-\d{2}$"
          required
        >
        <small class="order-form__small">Формат: +7 (900) 000-00-00</small>
      </div>

      <div class="order-form__field">
        <label class="order-form__label" for="order-date">Дата связи</label>
        <input
          class="order-form__input"
          id="order-date"
          name="date"
          type="date"
        >
      </div>

      <div class="order-form__field">
        <label class="order-form__label" for="order-topic">Выберите способ доставки</label>
        <select class="order-form__select" id="order-topic" name="topic" required>
          <option value="self">Самовывоз</option>
          <option value="delivery">Доставка на дом</option>
        </select>
      </div>

      <div class="order-form__field">
        <label class="order-form__label" for="order-comment">Комментарий</label>
        <textarea
          class="order-form__textarea"
          id="order-comment"
          name="comment"
          rows="4"
          placeholder="Укажите адрес доставки и дополнительную информацию"
        ></textarea>
      </div>

      <div class="order-form__field order-form__field--checkbox">
        <label class="order-form__labelcheckbox">
          <!-- input class="order-form__input" -->
          <input
            
            id="order-agreement"
            name="agreement"
            type="checkbox"
            required
          >
          Я согласен на обработку данных
        </label>
      </div>

      <div class="order-form__actions">
        <button class="button button--secondary" type="button" id="close-order-dialog">Закрыть</button>
        <button class="button button--primary" type="submit">Отправить заявку</button>
      </div>
    </form>
  </dialog>

  <p class="success-message" id="success-message" hidden>
    Форма успешно отправлена!
  </p>
  </main>

  <footer>
    <p>&copy; 2026 Учебный проект. Все права защищены.</p>
    <p>Дисциплина: Фронтенд и бэкенд разработка</p>
  </footer>
</body>
</html>
